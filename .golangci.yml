version: "2"
linters:
  enable:
    - depguard
    - gosec
    - importas
    - misspell
    - revive
    - unconvert
  disable:
    - errcheck
  settings:
    depguard:
      rules:
        main:
          deny:
            - pkg: io/ioutil
              desc: The io/ioutil package has been deprecated, see https://go.dev/doc/go1.16#ioutil
            - pkg: github.com/stretchr/testify/suite
              desc: Do not use
    importas:
      no-unaliased: true
    revive:
      rules:
        - name: package-comments
          disabled: true
    staticcheck:
      checks:
        - all
        - -SA1012
        - -SA1019
        - -ST1003
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - path: (.+)\.go$
        text: G601
      - path: (.+)\.go$
        text: G306
      - path: (.+)\.go$
        text: G204
      # Wire encoding truncates integers on purpose.
      - path: (.+)\.go$
        text: G115
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
